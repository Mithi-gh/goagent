name: Ubuntu 24.04 cancellation baseline
on:
  push:
    branches:
      - codex/test-ubuntu-24-baseline
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Test streaming cancellation with race detection
        run: go test -v -race -count=1 -timeout 10m -coverprofile=coverage.out -run '^TestStreamingLLMAgent_ContextCancellation_BeforeLLMCall$' ./stream
        env:
          GO_TEST_MODE: "true"
